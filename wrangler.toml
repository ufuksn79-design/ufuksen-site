# Cloudflare Workers yapılandırması — ADR-019 revizyon 3.
#
# Statik site + küçük bir URL davranış katmanı (worker/index.js).
#
# Katman neden gerekli: varsayılan varlık sunumu `/yazi.html`i 307 ile
# uzantısız yola yönlendiriyordu — ADR-007 (.html birebir korunur) ihlali.
# `html_handling = "none"` ile otomatik yönlendirmeler kapatılır; davranışı
# worker belirler (410'lar, AMP, attachment, eğik çizgi, dizin indeksi).

name = "ufuksen-site"
main = "worker/index.js"
compatibility_date = "2026-01-01"

# Canlı alan adları (2026-10-14, kullanıcı onayıyla).
#
# `custom_domain = true`: Cloudflare bu konak adlarının DNS kaydını kendisi
# kurar ve sertifikayı kendisi alır. Bu kayıtlar eskiden paylaşımlı hosting'e
# bakıyordu; bağlandığı andan itibaren alan adı WordPress'e değil bu Worker'a
# gider. WordPress dosyalarına DOKUNULMAZ — hosting'de olduğu gibi durur,
# geri dönüş bu iki satırı kaldırıp eski DNS kaydını geri koymaktır.
#
# E-posta etkilenmez: yalnızca bu konak adlarının A/CNAME kaydı değişir,
# MX kayıtları olduğu gibi kalır.
#
# Çıplak `ufuksen.com` da bağlanıyor çünkü bağlanmazsa eski hosting'e gitmeye
# devam ederdi. İstek Worker'a ulaşır ulaşmaz 301 ile `www`ye gider
# (worker/index.js, adım -1) — kanonik adresler `www` ile üretiliyor.
routes = [
  { pattern = "www.ufuksen.com", custom_domain = true },
  { pattern = "ufuksen.com", custom_domain = true },
]

# workers.dev adresi AÇIK kalmalı.
#
# `routes` tanımlanıp bu bayrak yazılmazsa wrangler workers.dev yolunu
# KAPATIR. 2026-10-14'te başımıza geldi: alan adı henüz bağlanmamışken
# workers.dev de kapandı ve yeni sitenin çalışan tek adresi kalmadı
# (her yol 404, Cloudflare hata kodu 1042).
#
# Alan adı bağlandıktan sonra bile açık kalsın: canlıya dokunmadan
# deneme yapabildiğimiz tek adres burası.
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Otomatik .html/eğik çizgi yönlendirmeleri KAPALI — kanonik URL'ler
# (/yazi.html, /blog) worker tarafından yönlendirmesiz sunulur.
html_handling = "none"
not_found_handling = "none"
# Worker yalnızca sayfa isteklerinde devreye girer; medya ve derleme
# varlıkları doğrudan sunulur (istek kotası harcamaz, daha hızlı).
run_worker_first = ["/*", "!/media/*", "!/_astro/*"]
