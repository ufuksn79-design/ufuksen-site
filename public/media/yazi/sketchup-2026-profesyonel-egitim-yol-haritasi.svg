<svg viewBox="0 0 560 428" width="560" height="428" role="img" xmlns="http://www.w3.org/2000/svg"><title>SketchUp 2026 eğitiminin altı duraklı yol haritası</title><rect width="560" height="428" fill="#17171b"/><text x="16" y="30" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="800" fill="#f2f2f4">Eğitimin yol haritası</text>
  <text x="16" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#9a9aa6">Her durak bir öncekinin üstüne biner; atlanan adım yok.</text>
  <line x1="34" y1="80" x2="34" y2="366" stroke="#3a3a43" stroke-width="2"/>
  <g>
      <circle cx="34" cy="80" r="15" fill="#17171b" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="34" y="85" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">1</text>
      <text x="62" y="78" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f2f2f4">Kurulum</text>
      <text x="62" y="96" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9a9aa6">Sürüm seçimi, lisans, ilk açılış ve şablon</text>
    </g><g>
      <circle cx="34" cy="134" r="15" fill="#17171b" stroke="#4ade80" stroke-width="2.5"/>
      <text x="34" y="139" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#4ade80">2</text>
      <text x="62" y="132" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f2f2f4">Arayüz</text>
      <text x="62" y="150" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9a9aa6">Araçlar, çıkarım sistemi, ölçü kutusu</text>
    </g><g>
      <circle cx="34" cy="188" r="15" fill="#17171b" stroke="#ffd400" stroke-width="2.5"/>
      <text x="34" y="193" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffd400">3</text>
      <text x="62" y="186" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f2f2f4">Modelleme</text>
      <text x="62" y="204" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9a9aa6">Grup, bileşen, etiket ve sahne düzeni</text>
    </g><g>
      <circle cx="34" cy="242" r="15" fill="#17171b" stroke="#fb923c" stroke-width="2.5"/>
      <text x="34" y="247" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#fb923c">4</text>
      <text x="62" y="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f2f2f4">Eklenti</text>
      <text x="62" y="258" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9a9aa6">Kurulum yolları ve iş akışına yerleştirme</text>
    </g><g>
      <circle cx="34" cy="296" r="15" fill="#17171b" stroke="#f472b6" stroke-width="2.5"/>
      <text x="34" y="301" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#f472b6">5</text>
      <text x="62" y="294" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f2f2f4">Render</text>
      <text x="62" y="312" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9a9aa6">Işık, malzeme, kamera ve renk yönetimi</text>
    </g><g>
      <circle cx="34" cy="350" r="15" fill="#17171b" stroke="#a78bfa" stroke-width="2.5"/>
      <text x="34" y="355" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#a78bfa">6</text>
      <text x="62" y="348" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f2f2f4">Sunum</text>
      <text x="62" y="366" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9a9aa6">LayOut ile pafta ve teslim</text>
    </g>
  <text x="16" y="412" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#9a9aa6">Eklentiler ve render, temel oturduktan sonra gelir.</text></svg>