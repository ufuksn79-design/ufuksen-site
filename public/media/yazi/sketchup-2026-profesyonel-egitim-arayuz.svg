  <text x="16" y="352" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#f2f2f4"><tspan fill="#ffd400" font-weight="800">1</tspan>  Araç çubuğu — çizim ve düzenleme araçları.</text>
  <text x="16" y="376" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#f2f2f4"><tspan fill="#38bdf8" font-weight="800">2</tspan>  Çizim alanı — eksenler, çıkarım çizgileri ve model.</text>
  <text x="16" y="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#f2f2f4"><tspan fill="#f472b6" font-weight="800">3</tspan>  Tepsiler — malzeme, bileşen, etiket, sahne ve eklenti panelleri.</text>
  <text x="16" y="424" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#f2f2f4"><tspan fill="#4ade80" font-weight="800">4</tspan>  Ölçü kutusu — sayıyı yazıp Enter'a basarsınız.</text>
  <text x="16" y="448" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#f2f2f4"><tspan fill="#fb923c" font-weight="800">5</tspan>  Durum çubuğu — aracın o an ne beklediğini söyler.</text></svg>