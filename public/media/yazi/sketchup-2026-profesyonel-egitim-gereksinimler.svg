  </g>
  <text x="16" y="500" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#ffd400">PBR doku, Ambient Occlusion ve IBL ile çalışacaksanız Windows'ta 32 GB VRAM öneriliyor.</text>
  <text x="16" y="520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9a9aa6">Cihaz yeni motorun koşullarını karşılamazsa SketchUp kendiliğinden klasik motora düşer.</text></svg>