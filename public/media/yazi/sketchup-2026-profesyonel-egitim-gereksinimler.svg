<svg viewBox="0 0 560 540" width="560" height="540" role="img" xmlns="http://www.w3.org/2000/svg"><title>SketchUp 2026 için Windows ve macOS sistem gereksinimleri</title><rect width="560" height="540" fill="#17171b"/><text x="16" y="30" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="800" fill="#f2f2f4">SketchUp 2026 sistem gereksinimleri</text>
