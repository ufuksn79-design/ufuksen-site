<svg viewBox="0 0 560 430" width="560" height="430" role="img" xmlns="http://www.w3.org/2000/svg"><title>Render Fun'ın çalışma akışı: model, ışın izleme, gürültü giderme, sonuç</title><rect width="560" height="430" fill="#17171b"/><text x="16" y="30" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="800" fill="#f2f2f4">Render Fun: SketchUp penceresinden çıkmadan ışın izleme</text>
  <text x="16" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#9a9aa6">Dışa aktarma yok, içe aktarma yok; model doğrudan okunur.</text>

  <rect x="16" y="68" width="150" height="150" rx="10" fill="#1e1e23" stroke="#3a3a43"/>
