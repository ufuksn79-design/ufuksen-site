# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Yönetim paneli yapılandırması (ADR-019).
#
# ÖNEMLİ: Panelde bir kaydı kaydettiğinizde dosyanın TAMAMI yeniden yazılır.
# Bu yüzden düzenlemediğiniz teknik alanlar (checksum, legacy URL, gömüler…)
# `widget: hidden` olarak tanımlandı — tanımlanmasalardı kayıt sırasında
# sessizce silinirlerdi ve göç doğrulaması bozulurdu.
#
# Depo: github.com/ufuksn79-design/ufuksen-site  (private)
#
# Depo adı farklı açılırsa aşağıdaki `repo` satırı da güncellenmeli;
# yoksa panel giriş yaptıktan sonra "depo bulunamadı" der.

backend:
  name: github
  repo: ufuksn79-design/ufuksen-site
  branch: main
  # GitHub girişini yapan köprü (Cloudflare Worker).
  # Netlify Identity / Git Gateway 2026'da kullanımdan kaldırıldı; yeni
  # kurulumlarda önerilmiyor. Bu yüzden resmi Sveltia yolu kullanılıyor.
  base_url: https://sveltia-cms-auth.ufuksn79.workers.dev
  commit_messages:
    create: "içerik: {{collection}} eklendi — {{slug}}"
    update: "içerik: {{collection}} güncellendi — {{slug}}"
    delete: "içerik: {{collection}} silindi — {{slug}}"
    uploadMedia: "medya: {{path}} yüklendi"
    deleteMedia: "medya: {{path}} silindi"

# Yerelde `npm run dev` çalışırken panel canlı depoya yazmasın diye
# geliştirme sunucusu kullanılabilir. Yayında bu satır etkisizdir.
local_backend: true

media_folder: public/media/yuklenen
public_folder: /media/yuklenen

locale: tr

collections:
  # ------------------------------------------------------------------ #
  # Blog yazıları
  # ------------------------------------------------------------------ #
  - name: posts
    label: Blog Yazıları
    label_singular: Yazı
    folder: src/content/posts
    extension: json
    format: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [publishedAt, title]
    fields:
      - { label: Başlık, name: title, widget: string }
      - {
          label: URL adresi (slug),
          name: slug,
          widget: string,
          hint: "Yayınlandıktan sonra DEĞİŞTİRMEYİN — arama motorundaki adres bozulur.",
        }
      - { label: Özet, name: excerpt, widget: text, required: false }
      - {
          label: İçerik,
          name: contentHtml,
          widget: markdown,
          hint: "Mevcut yazılar HTML olarak geldi; düzenlerken biçimlendirme korunur.",
        }
      - { label: Yayın tarihi, name: publishedAt, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss" }
      - { label: Son düzenleme, name: modifiedAt, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss" }
      - label: Öne çıkan görsel
        name: featuredImage
        widget: object
        required: false
        fields:
          - { label: Görsel, name: localPath, widget: image, required: false }
          - { label: Alternatif metin, name: alt, widget: string, required: false }
          - { label: Genişlik, name: width, widget: number, required: false }
          - { label: Yükseklik, name: height, widget: number, required: false }
          - { label: legacyId, name: legacyId, widget: hidden, required: false }
          - { label: legacyUrl, name: legacyUrl, widget: hidden, required: false }
          - { label: mimeType, name: mimeType, widget: hidden, required: false }
          - { label: error, name: error, widget: hidden, required: false }
      - label: Kategoriler
        name: categories
        widget: list
        required: false
        fields:
          - { label: Ad, name: name, widget: string }
          - { label: Slug, name: slug, widget: string }
          - { label: legacyId, name: legacyId, widget: hidden }
      - label: SEO
        name: seo
        widget: object
        fields:
          - { label: SEO başlığı, name: title, widget: string, required: false }
          - {
              label: Meta açıklama,
              name: description,
              widget: text,
              required: false,
              hint: "Google'da görünen açıklama. 120–160 karakter idealdir.",
            }
          - { label: Odak kelime, name: focusKeyword, widget: string, required: false }
          - {
              label: Arama motorlarına kapat (noindex),
              name: noindex,
              widget: boolean,
              default: false,
              required: false,
              hint: "Açılırsa bu yazı Google'da listelenmez. Normal yazılarda KAPALI bırakın.",
            }
          - { label: Canonical, name: canonicalUrl, widget: hidden, required: false }
          - { label: OG görseli, name: ogImage, widget: hidden, required: false }
      # --- Aşağıdakiler teknik alanlar; panelde görünmez ama korunur ---
      - { label: legacyId, name: legacyId, widget: hidden }
      - { label: legacyUrl, name: legacyUrl, widget: hidden }
      - { label: url, name: url, widget: hidden }
      - { label: status, name: status, widget: hidden }
      - { label: inlineMedia, name: inlineMedia, widget: hidden, required: false }
      - { label: embeds, name: embeds, widget: hidden, required: false }
      - { label: readingMinutes, name: readingMinutes, widget: hidden }
      - { label: migrationChecksum, name: migrationChecksum, widget: hidden }
      - { label: author, name: author, widget: hidden }
      - { label: tags, name: tags, widget: hidden, required: false }

  # ------------------------------------------------------------------ #
  # Sabit sayfalar
  # ------------------------------------------------------------------ #
  - name: pages
    label: Sayfalar
    label_singular: Sayfa
    folder: src/content/pages
    extension: json
    format: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: URL adresi (slug), name: slug, widget: string }
      - { label: İçerik, name: contentHtml, widget: markdown }
      - { label: Yayın tarihi, name: publishedAt, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss" }
      - { label: Son düzenleme, name: modifiedAt, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss" }
      - label: SEO
        name: seo
        widget: object
        fields:
          - { label: SEO başlığı, name: title, widget: string, required: false }
          - { label: Meta açıklama, name: description, widget: text, required: false }
          - { label: Odak kelime, name: focusKeyword, widget: hidden, required: false }
          - { label: Canonical, name: canonicalUrl, widget: hidden, required: false }
          - { label: OG görseli, name: ogImage, widget: hidden, required: false }
      - { label: excerpt, name: excerpt, widget: hidden, required: false }
      - { label: legacyId, name: legacyId, widget: hidden }
      - { label: legacyUrl, name: legacyUrl, widget: hidden }
      - { label: url, name: url, widget: hidden }
      - { label: status, name: status, widget: hidden }
      - { label: featuredImage, name: featuredImage, widget: hidden, required: false }
      - { label: inlineMedia, name: inlineMedia, widget: hidden, required: false }
      - { label: embeds, name: embeds, widget: hidden, required: false }
      - { label: readingMinutes, name: readingMinutes, widget: hidden }
      - { label: migrationChecksum, name: migrationChecksum, widget: hidden }


  # ------------------------------------------------------------------ #
  # Ürünler — her ürün kendi dosyasında (ADR-022)
  #
  # Yeni ürün eklemek için "Yeni Ürün" düğmesi yeterli; kod değişmez.
  # Doldurulmayan bölümler (galeri, video, S.S.S., fiyat) sayfada hiç
  # görünmez — boş başlık basılmaz.
  # ------------------------------------------------------------------ #
  - name: products
    label: Ürünler
    label_singular: Ürün
    folder: src/content/products
    extension: json
    format: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: ad
    summary: "{{ad}}"
    sortable_fields: [sira, ad]
    fields:
      - { label: Ad, name: ad, widget: string }
      - {
          label: URL adresi (slug),
          name: slug,
          widget: string,
          hint: "Ürün sayfasının adresi: /urunler/BURASI. Yayınlandıktan sonra DEĞİŞTİRMEYİN.",
        }
      - {
          label: Tür,
          name: tur,
          widget: select,
          default: eklenti,
          options:
            [
              { label: "SketchUp eklentisi", value: eklenti },
              { label: "Web aracı", value: arac },
              { label: "Şablon", value: sablon },
            ],
        }
      - {
          label: Durum,
          name: durum,
          widget: select,
          default: aktif,
          options:
            [
              { label: "Yayında", value: aktif },
              { label: "Beta", value: beta },
              { label: "Alfa", value: alfa },
              { label: "Geliştiriliyor", value: gelistiriliyor },
              { label: "Arşiv", value: arsiv },
            ],
        }
      - {
          label: Sitede göster,
          name: yayinda,
          widget: boolean,
          default: true,
          hint: "Kapatırsanız ürün sitede hiçbir yerde görünmez. Hazır olmayan kaydı burada bekletebilirsiniz.",
        }
      - {
          label: İlerleme yüzdesi,
          name: ilerleme,
          widget: number,
          required: false,
          value_type: int,
          min: 0,
          max: 100,
          hint: "Yalnızca 'Geliştiriliyor' durumunda anlamlı. Boş bırakılabilir.",
        }
      - { label: Sürüm, name: surum, widget: string, required: false, hint: "Örnek: 3.1.5" }
      - {
          label: Sıra,
          name: sira,
          widget: number,
          default: 99,
          value_type: int,
          hint: "Listede küçük sayı önce gelir.",
        }

      - { label: Özet, name: ozet, widget: text, hint: "Kartta görünen tek cümle." }
      - {
          label: Açıklama,
          name: aciklama,
          widget: text,
          required: false,
          hint: "'Ne işe yarar?' bölümü. Hangi sorunu çözdüğünü anlatın.",
        }
      - { label: Slogan, name: slogan, widget: string, required: false }

      - label: Kapak görseli
        name: kapak
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Görsel, name: src, widget: image }
          - {
              label: Alternatif metin,
              name: alt,
              widget: string,
              hint: "Görselde ne olduğunu yazın; ekran okuyucular ve Google bunu okur.",
            }
          - { label: Alt yazı, name: not, widget: string, required: false }

      - label: Ekran görüntüleri
        name: galeri
        widget: list
        required: false
        collapsed: true
        label_singular: Görsel
        summary: "{{alt}}"
        fields:
          - { label: Görsel, name: src, widget: image }
          - { label: Alternatif metin, name: alt, widget: string }
          - { label: Alt yazı, name: not, widget: string, required: false }

      - label: Tanıtım videosu
        name: video
        widget: object
        required: false
        collapsed: true
        fields:
          - {
              label: YouTube kimliği,
              name: youtubeId,
              widget: string,
              hint: "Video adresindeki v= sonrasındaki kod. Örnek: dQw4w9WgXcQ",
            }
          - { label: Başlık, name: baslik, widget: string, required: false }

      - {
          label: Uyumluluk,
          name: uyumluluk,
          widget: list,
          required: false,
          hint: "Her satıra bir tane. Örnek: SketchUp 2024",
        }

      - label: Özellikler
        name: ozellikler
        widget: list
        required: false
        label_singular: Özellik
        summary: "{{baslik}}"
        fields:
          - { label: Başlık, name: baslik, widget: string }
          - { label: Açıklama, name: not, widget: string }
          - {
              label: İkon,
              name: ikon,
              widget: select,
              default: grid,
              options:
                [grid, bolt, ruler, sliders, layers, texture, kesim, kutu, indir, bulut, kod, onay, saat, goz],
            }

      - label: Listeler
        name: listeler
        widget: list
        required: false
        collapsed: true
        label_singular: Liste
        summary: "{{baslik}}"
        hint: "Adlandırılmış listeler: 'Desen kütüphanesi', 'Desteklenen formatlar' gibi."
        fields:
          - { label: Başlık, name: baslik, widget: string }
          - { label: Öğeler, name: ogeler, widget: list }
          - { label: Not, name: not, widget: string, required: false }

      - {
          label: Öne çıkanlar,
          name: vurgular,
          widget: list,
          required: false,
          hint: "Kartta rozet olarak görünür; ilk üçü gösterilir.",
        }

      - label: Sık sorulanlar
        name: sss
        widget: list
        required: false
        collapsed: true
        label_singular: Soru
        summary: "{{soru}}"
        fields:
          - { label: Soru, name: soru, widget: string }
          - { label: Cevap, name: cevap, widget: text }

      - label: Fiyat
        name: fiyat
        widget: object
        required: false
        collapsed: true
        fields:
          - {
              label: Tutar,
              name: tutar,
              widget: number,
              required: false,
              hint: "Boş bırakılırsa fiyat sitede hiç gösterilmez.",
            }
          - { label: Para birimi, name: paraBirimi, widget: string, default: TRY }
          - {
              label: Not,
              name: not,
              widget: string,
              required: false,
              hint: "Örnek: KDV dahil, tek seferlik ödeme.",
            }

      - { label: Satın alma bağlantısı, name: satinAlmaUrl, widget: string, required: false }
      - { label: Deneme sürümü bağlantısı, name: denemeUrl, widget: string, required: false }
      - { label: İletişim e-postası, name: iletisimEposta, widget: string, required: false }

      - {
          label: İlgili yazılım,
          name: yazilim,
          widget: list,
          required: false,
          hint: "Arşivdeki ilgili yazıları bağlar. Örnek: sketchup, vray, d5-render",
        }
      - {
          label: İç not,
          name: icNot,
          widget: text,
          required: false,
          hint: "Yalnızca panelde görünür, sitede hiçbir yerde basılmaz.",
        }

  # ------------------------------------------------------------------ #
  # Tek dosyalık ayarlar
  # ------------------------------------------------------------------ #
  - name: ayarlar
    label: Site Ayarları
    files:
      - name: seo
        label: SEO Ayarları
        file: src/content/seo.json
        fields:
          - { label: Açıklama, name: aciklama, widget: hidden }
          - {
              label: Site başlığı,
              name: siteBasligi,
              widget: string,
              hint: "Marka adı. Sosyal paylaşımlarda ve site adı olarak kullanılır.",
            }
          - {
              label: Varsayılan açıklama,
              name: varsayilanAciklama,
              widget: text,
              hint: "Kendi açıklaması olmayan sayfalarda Google'da görünen metin. 120–160 karakter.",
            }
          - {
              label: Varsayılan paylaşım görseli,
              name: varsayilanPaylasimGorseli,
              widget: image,
              hint: "Sosyal medyada paylaşılınca çıkan görsel. 1200×630 px önerilir.",
            }
          - { label: Kişi adı (schema), name: kisiAdi, widget: string }
          - { label: Kişi unvanı (schema), name: kisiUnvani, widget: string }
          - {
              label: X (Twitter) kullanıcısı,
              name: twitterKullanici,
              widget: string,
              required: false,
              hint: "@ ile başlayan kullanıcı adı. Twitter kartlarında kullanılır.",
            }
          - {
              label: Google Search Console doğrulama kodu,
              name: googleDogrulama,
              widget: string,
              required: false,
              hint: "Search Console 'HTML etiketi' yönteminde verilen content değeri. Sadece kod.",
            }
          - {
              label: Bing doğrulama kodu,
              name: bingDogrulama,
              widget: string,
              required: false,
            }
          - {
              label: Google Analytics ID (isteğe bağlı),
              name: googleAnalyticsId,
              widget: string,
              required: false,
              hint: "BOŞ bırakılırsa izleme yok. Doldurulursa Analytics yüklenir — KVKK/çerez onayı sizin sorumluluğunuzda.",
            }
          - { label: Not, name: not, widget: hidden, required: false }

      - name: iletisim
        label: İletişim (WhatsApp)
        file: src/content/contact.json
        fields:
          - { label: Açıklama, name: aciklama, widget: hidden }
          - {
              label: WhatsApp numarası,
              name: whatsappNumara,
              widget: string,
              required: false,
              hint: "Ülke kodu + numara, SADECE rakam. Örnek: 905303229301. BOŞ bırakılırsa WhatsApp butonları sitede hiç görünmez.",
            }
          - {
              label: Görünen numara,
              name: whatsappGorunenNumara,
              widget: string,
              required: false,
              hint: "İnsanların okuyacağı biçim. Örnek: 0530 322 93 01",
            }
          - { label: E-posta, name: eposta, widget: string, required: false }
          - { label: Kaynak, name: kaynak, widget: hidden, required: false }
          - { label: Not, name: not, widget: hidden, required: false }

      - name: sosyal
        label: Sosyal Bağlantılar
        file: src/content/social.json
        fields:
          - { label: Açıklama, name: aciklama, widget: hidden }
          - { label: Kaynak, name: kaynak, widget: hidden }
          - label: Bağlantılar
            name: baglantilar
            widget: list
            fields:
              - { label: Kimlik, name: id, widget: string }
              - { label: Ad, name: ad, widget: string }
              - { label: Adres, name: url, widget: string, required: false }
              - { label: Etiket, name: etiket, widget: string }
              - { label: Görünsün mü, name: aktif, widget: boolean }

      - name: egitimler
        label: Eğitim Setleri
        file: src/content/courses.json
        fields:
          - { label: Kaynak, name: kaynak, widget: hidden }
          - { label: Çekilme tarihi, name: cekilmeTarihi, widget: hidden }
          - { label: Not, name: not, widget: hidden }
          - label: Kurslar
            name: kurslar
            widget: list
            fields:
              - { label: Başlık, name: baslik, widget: string }
              - { label: Alt başlık, name: altBaslik, widget: string, required: false }
              - { label: Slug, name: slug, widget: string }
              - { label: Udemy adresi, name: url, widget: string }
              - { label: Kapak görseli, name: gorsel, widget: image }
              - { label: Puan, name: puan, widget: number, value_type: float }
              - { label: Yorum sayısı, name: yorumSayisi, widget: number }
              - { label: Süre (saat), name: saat, widget: number, value_type: float }
              - { label: Ders sayısı, name: dersSayisi, widget: number }
              - { label: Seviye, name: seviye, widget: string }
              - { label: İlgili yazılım, name: yazilim, widget: list, required: false }
              - { label: gorselKaynak, name: gorselKaynak, widget: hidden, required: false }
